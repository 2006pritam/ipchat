<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPChat — Room-Based Messenger</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- JOIN SCREEN -->
    <div id="join-screen" class="screen active">
      <div class="join-card">
        <div class="join-logo">
          <span class="logo-bracket">[</span>
          <span class="logo-text">IP</span><span class="logo-text accent">CHAT</span>
          <span class="logo-bracket">]</span>
        </div>
        <p class="join-subtitle">Enter a shared IP address to join the same room</p>
        <div class="form-group">
          <label for="username-input">USERNAME</label>
          <input id="username-input" type="text" placeholder="e.g. alice" maxlength="20" autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="ip-input">IP ADDRESS (ROOM CODE)</label>
          <input id="ip-input" type="text" placeholder="e.g. 192.168.1.1" autocomplete="off" />
          <span class="field-hint">Anyone who enters the same IP will share this room</span>
        </div>
        <button id="join-btn" class="join-btn">
          <span>CONNECT</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>
        <p id="join-error" class="error-msg"></p>
        <p id="wake-status" class="wake-status"></p>
      </div>
      <footer class="site-footer">© 2026 All copyright reserved by Pritam Kumar Modak</footer>
      <div class="bg-grid"></div>
    </div>

    <!-- CHAT SCREEN -->
    <div id="chat-screen" class="screen">
      <!-- Drag and Drop Overlay -->
      <div id="drag-drop-overlay" class="drag-drop-overlay">
        <div class="drag-drop-content">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
          <span>Drop photo to upload & encrypt</span>
        </div>
      </div>

      <aside class="sidebar">
        <div class="sidebar-logo">
          <span class="logo-bracket">[</span>IP<span class="accent">CHAT</span><span class="logo-bracket">]</span>
        </div>

        <div class="room-info-block">
          <div class="room-label">ROOM</div>
          <div id="room-display" class="room-ip">—</div>
          <div class="users-online">
            <span class="dot"></span>
            <span id="user-count">1</span> online
          </div>
        </div>

        <!-- Members list -->
        <div class="members-block">
          <div class="members-label">MEMBERS</div>
          <div id="members-list" class="members-list"></div>
        </div>

        <button id="leave-btn" class="leave-btn">← Leave Room</button>
      </aside>

      <main class="chat-main">
        <header class="chat-header">
          <button id="menu-toggle" class="menu-toggle" aria-label="Toggle sidebar">☰</button>
          <div class="header-room">
            <span class="header-label">ROOM //</span>
            <span id="header-ip">—</span>
          </div>
          <button id="clear-btn" class="clear-btn" title="Clear chat for everyone">🗑 Clear</button>
          <div class="header-user" id="header-username">—</div>
        </header>

        <div id="messages" class="messages-area">
          <div class="welcome-msg"><span>— Start of conversation —</span></div>
        </div>

        <div id="typing-indicator" class="typing-indicator"></div>

        <!-- Reply preview bar -->
        <div id="reply-preview" class="reply-preview">
          <div class="reply-preview-inner">
            <span class="reply-icon">↩</span>
            <span id="reply-text" class="reply-preview-text"></span>
          </div>
          <button id="reply-cancel" class="reply-cancel-btn" aria-label="Cancel reply">✕</button>
        </div>

        <!-- Active Voice Recording Bar -->
        <div id="recording-bar" class="recording-bar">
          <div class="recording-status">
            <span class="rec-dot"></span>
            <span class="rec-label">REC</span>
            <span id="recording-timer" class="rec-timer">0:00</span>
            <div class="voice-wave-anim">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
          </div>
          <div class="recording-actions">
            <button id="cancel-recording-btn" class="rec-btn cancel" title="Cancel voice note" aria-label="Cancel recording">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M18 6L6 18M6 6l12 12"/>
              </svg>
            </button>
            <button id="send-recording-btn" class="rec-btn send" title="Send voice note" aria-label="Send recording">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="input-bar" id="chat-input-bar">
          <!-- Photo Upload (File Picker / Camera) -->
          <input type="file" id="image-input" accept="image/*" style="display:none" />
          <button id="image-btn" class="action-circle-btn" aria-label="Upload Photo" title="Upload photo (or drag & drop / paste)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="M21 15l-5-5L5 21"/>
            </svg>
          </button>

          <!-- Voice Note Button -->
          <button id="voice-btn" class="action-circle-btn" aria-label="Record Voice Note" title="Record voice note">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
          </button>

          <input id="message-input" type="text" placeholder="Type a message… (or paste/drag images)" maxlength="500" autocomplete="off" />

          <button id="send-btn" class="send-btn" aria-label="Send">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/>
            </svg>
          </button>
        </div>
      </main>
    </div>

    <!-- Fullscreen Image Viewer Modal -->
    <div id="image-viewer-modal" class="img-overlay" style="display:none;">
      <div class="overlay-controls">
        <a id="overlay-download-btn" class="overlay-btn" title="Download image" download="ipchat-photo.png" target="_blank">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </a>
        <button id="overlay-close-btn" class="overlay-btn" title="Close">✕</button>
      </div>
      <img id="overlay-img" src="" alt="Full view photo" />
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
  </body>
</html>
